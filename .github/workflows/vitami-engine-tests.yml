name: VITAMI engine safety tests
on:
  push:
    branches:
      - design/adaptive-questionnaire-v2
  pull_request:
  workflow_dispatch:
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BASIC safety regression
        run: node phase2/tests/basicSafetyRegression.test.js
      - name: Adaptive questionnaire regression
        run: node phase2/tests/adaptiveQuestionnaire.test.js
      - name: BASIC presentation adapter regression
        run: node phase2/tests/basicPresentationAdapter.test.js
      - name: Library deep-link regression
        run: node phase2/tests/libraryLinks.test.js
      - name: BASIC journey integration regression
        run: node phase2/tests/basicJourney.test.js
