name: VITAMI engine safety tests
on:
  push:
    branches:
      - design/adaptive-questionnaire-v2
  pull_request:
  workflow_dispatch:
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BASIC safety regression
        run: node phase2/tests/basicSafetyRegression.test.js
      - name: Adaptive questionnaire regression
        run: node phase2/tests/adaptiveQuestionnaire.test.js
      - name: BASIC presentation adapter regression
        run: node phase2/tests/basicPresentationAdapter.test.js
      - name: Library deep-link regression
        run: node phase2/tests/libraryLinks.test.js
      - name: BASIC journey integration regression
        run: node phase2/tests/basicJourney.test.js
      - name: Real repository assets smoke test
        run: node phase2/tests/realRepositorySmoke.test.js
      - name: Scientific evidence gate regression
        run: node phase2/tests/scientificEvidenceGate.test.js
      - name: Legacy UI answer normalization regression
        run: node phase2/tests/normalizeAnswers.test.js
      - name: Scientific asset ID integrity regression
        run: node phase2/tests/auditAssetIds.test.js
      - name: Scientific cross-reference audit regression
        run: node phase2/tests/auditScientificReferences.test.js
      - name: Real goal-first questionnaire audit
        run: node phase2/tests/auditQuestionnaireConfig.test.js
      - name: Strict clinical rule input regression
        run: node phase2/tests/strictRuleInputs.test.js
